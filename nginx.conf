server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed assets under /assets. Cache them aggressively because
    # their names change whenever their contents change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep client-side routes working when a user loads or refreshes them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
