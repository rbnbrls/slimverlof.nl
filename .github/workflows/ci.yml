name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, build and coverage
    runs-on: ubuntu-latest
    # Recorded coverage gate. `npm run coverage` runs the vitest suite with these
    # as its thresholds and fails the job when any metric drops below them; they
    # are the levels measured on main at a898577 (lines 98.03%, statements 97.64%,
    # functions 93.58%, branches 94.17%), floored to whole percent. vitest.config.js
    # reads the same variables so a local run enforces an identical gate, and
    # tests/coverage-gate.test.mjs fails when the two drift apart.
    env:
      COVERAGE_LINES_THRESHOLD: 98
      COVERAGE_STATEMENTS_THRESHOLD: 97
      COVERAGE_FUNCTIONS_THRESHOLD: 93
      COVERAGE_BRANCHES_THRESHOLD: 94
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:ci

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Deploy workflow tests (node --test)
        run: npm test

      - name: Unit tests with coverage (fails below the recorded thresholds)
        run: npm run coverage

      # The report CI enforces must also be the report the repository publishes: the
      # thresholds above say what the level must be, these two steps record what it
      # *is*, in a file readable from the default branch. The check fails when a
      # change moves coverage without refreshing the committed report.
      - name: Publish the coverage report
        if: always()
        run: npm run coverage:report

      - name: Committed coverage report matches this run
        if: always()
        run: npm run coverage:report:check

      - name: Coverage line total
        if: always()
        run: node scripts/coverage-summary.mjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
