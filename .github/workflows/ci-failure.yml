
# Coolify deployment failure feedback loop
# Creates or updates a repository issue with failed job details and logs.

name: Create issue on Coolify deployment failure

on:
  workflow_run:
    workflows: ['Deploy to Coolify']
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  create-issue:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: self-hosted
    steps:
      - name: Create or update Coolify failure issue
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const NL = String.fromCharCode(10);
            const marker = '<!-- coolify-failure-run:' + run.id + ' -->';
            const conclusion = run.conclusion || 'unknown';
            const workflow = run.name || 'Deploy to Coolify';
            const branch = run.head_branch || '(unknown)';
            const runUrl = run.html_url;
            const sha = run.head_sha || '(unknown)';
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
            const failedJobs = jobsResponse.data.jobs.filter((job) => ['failure', 'timed_out', 'cancelled'].includes(job.conclusion));
            const logSections = [];
            for (const job of failedJobs.slice(0, 10)) {
              try {
                const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', { owner, repo, job_id: job.id });
                let log = String(response.data || '').split(String.fromCharCode(13)).join('').trim().slice(-12000);
                logSections.push('### ' + job.name + ' (' + job.conclusion + ')' + NL + NL + 'LOG START' + NL + (log || '(no log content returned)') + NL + 'LOG END');
              } catch (error) {
                logSections.push('### ' + job.name + ' (' + job.conclusion + ')' + NL + NL + 'Could not download this job log: ' + error.message);
              }
            }
            const failedJobTable = failedJobs.length ? failedJobs.map((job) => '| ' + job.name + ' | ' + job.conclusion + ' |').join(NL) : '| (job details unavailable) | ' + conclusion + ' |';
            const logs = logSections.length ? logSections.join(NL + NL) : 'No failed job logs were available. Open the workflow run for details.';
            const body = [
              '## Coolify deployment failure', '',
              '**Workflow:** ' + workflow,
              '**Run:** [#' + run.run_number + '](' + runUrl + ')',
              '**Branch:** ' + branch,
              '**Commit:** ' + sha,
              '**Conclusion:** ' + conclusion, '',
              '### Failed jobs', '', '| Job | Status |', '|-----|--------|', failedJobTable, '',
              '### Coolify / runner logs', '', logs, '',
              '### Next steps', '',
              '1. Identify the first actionable error in the logs above.',
              '2. Fix the deployment or Coolify configuration and push the change.',
              '3. Re-run the workflow if the fix is configuration-only.', '',
              '---', 'Created automatically by the Coolify deployment feedback loop.', marker,
            ].join(NL);
            const existing = await github.rest.search.issuesAndPullRequests({ q: '"' + marker + '" repo:' + owner + '/' + repo + ' is:issue is:open', per_page: 1 });
            if (existing.data.items.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.data.items[0].number, body });
              core.info('Updated existing issue #' + existing.data.items[0].number);
              return;
            }
            const created = await github.rest.issues.create({ owner, repo, title: '[Coolify Failure] ' + workflow + ' #' + run.run_number + ' (' + branch + ')', body, labels: ['ci-failure'] });
            core.info('Created issue #' + created.data.number + ': ' + created.data.html_url);
