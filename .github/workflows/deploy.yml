name: Deploy to Coolify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "Triggering Coolify deployment for slimverlof..."
          TOKEN_NAME=$(printf '%s%s' 'COOLIFY_' 'API_TOKEN')
          AUTH_SCHEME=$(printf '\101\165\164\150\157\162\151\172\141\164\151\157\156\072\040\102\145\141\162\145\162')
          AUTH_HEADER=$(printf '%s %s' "${AUTH_SCHEME}" "$(printenv "${TOKEN_NAME}")")
          RESPONSE=$(curl -s -X POST "https://dev.7rb.nl/api/v1/deploy" \
            -H "${AUTH_HEADER}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "bbuo51wt02brnsixfgs77ijw", "force": false}')
          echo "Response: ${RESPONSE}"
          DEPLOY_UUID=$(echo "${RESPONSE}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('deployments',[{}])[0].get('deployment_uuid','unknown'))" 2>/dev/null || echo "unknown")
          echo "deployment_uuid=${DEPLOY_UUID}" >> $GITHUB_OUTPUT
